[project]
name = "geovoto"
version = "0.1.0"
description = "Geografia da divisão eleitoral no Brasil, 2014–2026"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "geopandas>=1.2.0",
    "libpysal>=4.15.0",
    "pymc>=6.3.2",
    "esda>=2.10.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geovoto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
python-preference = "only-managed"   # o Python do sistema não traz Python.h (PyTensor compila C)
