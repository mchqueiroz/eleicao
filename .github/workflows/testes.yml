name: testes
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # sem data/ no runner: os testes de dados são pulados; os de lógica (simulação) rodam
      - run: uv run pytest -q
